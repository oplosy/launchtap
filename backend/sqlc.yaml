version: "2"

sql:
  - engine: "postgresql"
    schema: "internal/store/postgres/migrations"
    queries: "internal/store/postgres/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_empty_slices: true
        overrides:
          # PostgreSQL bytea has no length identity. These remain column
          # overrides (with table wildcards only where the column contract is
          # identical across every table), never a bytea-wide type override.
          - column: "tokens.graduation_block_hash"
            go_type: {type: "Hash", pointer: true}
          - column: "tokens.graduation_tx_hash"
            go_type: {type: "Hash", pointer: true}
          - column: "*.block_hash"
            go_type: {type: "Hash"}
          - column: "*.tx_hash"
            go_type: {type: "Hash"}
          - column: "indexed_blocks.parent_hash"
            go_type: {type: "Hash"}
          - column: "sync_state.observed_hash"
            go_type: {type: "Hash", pointer: true}
          - column: "sync_state.safe_hash"
            go_type: {type: "Hash", pointer: true}
          - column: "sync_state.finalized_hash"
            go_type: {type: "Hash", pointer: true}
          - column: "indexer_reorgs.detected_tip_hash"
            go_type: {type: "Hash"}
          - column: "indexer_reorgs.common_ancestor_hash"
            go_type: {type: "Hash"}
          - column: "token_images.sha256"
            go_type: {type: "Hash"}
          - column: "telegram_link_codes.code_sha256"
            go_type: {type: "Hash"}
          - column: "wallet_funding.funding_tx"
            go_type: {type: "Hash", pointer: true}
          - column: "wallet_funding.funder"
            go_type: {type: "Address", pointer: true}
          - column: "funding_excluded_funders.address"
            go_type: {type: "Address"}
          - column: "token_metadata.launch_tx_hash"
            go_type: {type: "Hash", pointer: true}
          - column: "token_images.launch_tx_hash"
            go_type: {type: "Hash", pointer: true}
          - column: "future_defaults_configurations.config_hash"
            go_type: {type: "Hash"}
          - column: "tokens.launch_block_hash"
            go_type: {type: "Hash"}
          - column: "tokens.launch_tx_hash"
            go_type: {type: "Hash"}
          - column: "token_reserves.source_block_hash"
            go_type: {type: "Hash"}
          - column: "token_reserves.source_tx_hash"
            go_type: {type: "Hash"}

          - column: "*.token_address"
            go_type: {type: "Address"}
          - column: "*.curve_address"
            go_type: {type: "Address"}
          - column: "*.creator"
            go_type: {type: "Address"}
          # Engine 2 has no pair or WETH: these are NULL for every v2 row.
          - column: "token_launches.lp_pair"
            go_type: {type: "Address", pointer: true}
          - column: "tokens.lp_pair"
            go_type: {type: "Address", pointer: true}
          - column: "graduations.lp_pair"
            go_type: {type: "Address", pointer: true}
          - column: "token_launches.weth"
            go_type: {type: "Address", pointer: true}
          - column: "tokens.weth"
            go_type: {type: "Address", pointer: true}
          # Engine-2 launch facts, NULL for every v1 row.
          - column: "token_launches.hook"
            go_type: {type: "Address", pointer: true}
          - column: "tokens.hook"
            go_type: {type: "Address", pointer: true}
          - column: "token_launches.locker"
            go_type: {type: "Address", pointer: true}
          - column: "tokens.locker"
            go_type: {type: "Address", pointer: true}
          - column: "v4_pools.hook"
            go_type: {type: "Address"}
          - column: "v4_pool_managers.pool_manager"
            go_type: {type: "Address"}
          - column: "v4_pool_initializations.hooks"
            go_type: {type: "Address"}
          - column: "*.currency0"
            go_type: {type: "Address"}
          - column: "*.currency1"
            go_type: {type: "Address"}
          - column: "*.recipient"
            go_type: {type: "Address"}
          - column: "*.current_recipient"
            go_type: {type: "Address"}
          - column: "*.previous_recipient"
            go_type: {type: "Address"}
          - column: "*.next_recipient"
            go_type: {type: "Address"}
          - column: "v4_swaps.tx_from"
            go_type: {type: "Address", pointer: true}
          - column: "graduations.pool_id"
            go_type: {type: "Hash", pointer: true}
          - column: "v4_pools.pool_id"
            go_type: {type: "Hash"}
          - column: "v4_pool_initializations.pool_id"
            go_type: {type: "Hash"}
          - column: "v4_liquidity_changes.pool_id"
            go_type: {type: "Hash"}
          - column: "v4_swaps.pool_id"
            go_type: {type: "Hash"}
          - column: "v4_liquidity_changes.salt"
            go_type: {type: "Hash"}
          - column: "*.protocol_treasury"
            go_type: {type: "Address"}
          - column: "*.trader"
            go_type: {type: "Address"}
          - column: "*.treasury"
            go_type: {type: "Address"}
          - column: "*.account"
            go_type: {type: "Address"}
          - column: "*.from_address"
            go_type: {type: "Address"}
          - column: "*.to_address"
            go_type: {type: "Address"}
          - column: "*.pair_address"
            go_type: {type: "Address"}
          - column: "*.sender"
            go_type: {type: "Address"}
          - column: "*.implementation"
            go_type: {type: "Address"}
          - column: "*.previous_treasury"
            go_type: {type: "Address"}
          - column: "*.new_treasury"
            go_type: {type: "Address"}
          - column: "*.holder_address"
            go_type: {type: "Address"}
          - column: "*.wallet"
            go_type: {type: "Address"}
          - column: "pool_swaps.tx_from"
            go_type: {type: "Address", pointer: true}

          # numeric(78,0) is also overridden per column name so the
          # numeric(38,18) USD enrichment columns remain pgtype.Numeric.
          - column: "*.total_supply"
            go_type: {type: "Uint256"}
          - column: "*.virtual_eth"
            go_type: {type: "Uint256"}
          - column: "*.virtual_token"
            go_type: {type: "Uint256"}
          - column: "*.initial_virtual_eth"
            go_type: {type: "Uint256"}
          - column: "*.initial_virtual_token"
            go_type: {type: "Uint256"}
          - column: "*.curve_tokens"
            go_type: {type: "Uint256"}
          - column: "*.lp_tokens"
            go_type: {type: "Uint256"}
          - column: "*.graduation_eth"
            go_type: {type: "Uint256"}
          - column: "*.launch_fee_paid"
            go_type: {type: "Uint256"}
          - column: "*.eth_gross"
            go_type: {type: "Uint256"}
          - column: "*.eth_refund"
            go_type: {type: "Uint256"}
          - column: "*.token_amount"
            go_type: {type: "Uint256"}
          - column: "*.protocol_fee"
            go_type: {type: "Uint256"}
          - column: "*.creator_fee"
            go_type: {type: "Uint256"}
          - column: "*.new_eth_reserve"
            go_type: {type: "Uint256"}
          - column: "*.new_token_reserve"
            go_type: {type: "Uint256"}
          - column: "*.eth_to_pool"
            go_type: {type: "Uint256"}
          - column: "*.tokens_to_pool"
            go_type: {type: "Uint256"}
          - column: "graduations.lp_liquidity_burned"
            go_type: {type: "Uint256", pointer: true}
          # Engine-2 graduation facts, NULL for every v1 graduation.
          - column: "graduations.position_token_id"
            go_type: {type: "Uint256", pointer: true}
          - column: "graduations.liquidity"
            go_type: {type: "Uint256", pointer: true}
          - column: "graduations.sqrt_price_x96"
            go_type: {type: "Uint256", pointer: true}
          - column: "graduations.eth_remainder"
            go_type: {type: "Uint256", pointer: true}
          - column: "graduations.token_remainder"
            go_type: {type: "Uint256", pointer: true}
          - column: "v4_pools.position_token_id"
            go_type: {type: "Uint256"}
          - column: "trades.snipe_tax"
            go_type: {type: "Uint256"}
          - column: "*.eth_amount"
            go_type: {type: "Uint256"}
          - column: "v4_pool_initializations.sqrt_price_x96"
            go_type: {type: "Uint256"}
          - column: "v4_swaps.sqrt_price_x96"
            go_type: {type: "Uint256"}
          - column: "v4_swaps.liquidity"
            go_type: {type: "Uint256"}
          # Signed V4 deltas (liquidity_delta, amount0_delta, amount1_delta) stay
          # pgtype.Numeric: Uint256 rejects negatives by design.
          - column: "*.amount"
            go_type: {type: "Uint256"}
          - column: "*.value"
            go_type: {type: "Uint256"}
          - column: "*.remaining_cost"
            go_type: {type: "Uint256"}
          - column: "*.transferred_in"
            go_type: {type: "Uint256"}
          - column: "*.eth_paid"
            go_type: {type: "Uint256"}
          - column: "*.eth_received"
            go_type: {type: "Uint256"}
          - column: "*.amount0"
            go_type: {type: "Uint256"}
          - column: "*.amount1"
            go_type: {type: "Uint256"}
          - column: "*.amount0_in"
            go_type: {type: "Uint256"}
          - column: "*.amount1_in"
            go_type: {type: "Uint256"}
          - column: "*.amount0_out"
            go_type: {type: "Uint256"}
          - column: "*.amount1_out"
            go_type: {type: "Uint256"}
          - column: "*.reserve0"
            go_type: {type: "Uint256"}
          - column: "*.reserve1"
            go_type: {type: "Uint256"}
          # A 'v4' reserve row carries the pool price instead of reserves.
          - column: "token_reserves.eth_reserve"
            go_type: {type: "Uint256", pointer: true}
          - column: "token_reserves.token_reserve"
            go_type: {type: "Uint256", pointer: true}
          - column: "token_reserves.sqrt_price_x96"
            go_type: {type: "Uint256", pointer: true}
          - column: "*.eth_reserve"
            go_type: {type: "Uint256"}
          - column: "*.token_reserve"
            go_type: {type: "Uint256"}
          - column: "*.balance"
            go_type: {type: "Uint256"}
          - column: "*.open_price_wad"
            go_type: {type: "Uint256"}
          - column: "*.high_price_wad"
            go_type: {type: "Uint256"}
          - column: "*.low_price_wad"
            go_type: {type: "Uint256"}
          - column: "*.close_price_wad"
            go_type: {type: "Uint256"}
          - column: "*.gross_eth_volume"
            go_type: {type: "Uint256"}
          - column: "*.token_volume"
            go_type: {type: "Uint256"}
          - column: "*.spot_price_eth_wad"
            go_type: {type: "Uint256"}
          - column: "*.market_cap_eth_wad"
            go_type: {type: "Uint256"}
          - column: "*.fdv_eth_wad"
            go_type: {type: "Uint256"}
          # NULL for a graduated engine-2 token (pre-flight R5).
          - column: "token_stats.liquidity_eth_wad"
            go_type: {type: "Uint256", pointer: true}
          - column: "*.liquidity_eth_wad"
            go_type: {type: "Uint256"}
          - column: "creator_fee_balances.curve_eth_owed"
            go_type: {type: "Uint256"}
          - column: "creator_fee_balances.locker_eth_owed"
            go_type: {type: "Uint256"}
          - column: "creator_fee_balances.locker_token_owed"
            go_type: {type: "Uint256"}
          - column: "*.ath_price_eth_wad"
            go_type: {type: "Uint256"}
          - column: "*.volume_24h_eth_wad"
            go_type: {type: "Uint256"}
          - column: "tokens.sort_market_cap_eth_wad"
            go_type: {type: "Uint256"}
          - column: "tokens.sort_volume_24h_eth_wad"
            go_type: {type: "Uint256"}
          - column: "*.volume_eth_wad"
            go_type: {type: "Uint256"}
          - column: "*.volume_all_time_eth_wad"
            go_type: {type: "Uint256"}
          - column: "*.window_volume_eth_wad"
            go_type: {type: "Uint256"}
          - column: "*.remaining_eth_wad"
            go_type: {type: "Uint256"}
