version: "3"

env:
  GOCACHE: "{{.ROOT_DIR}}/.cache/go-build"

tasks:
  setup:
    desc: Download application module dependencies.
    cmds:
      - go mod download

  build:
    desc: Build every backend package.
    cmds:
      - go build ./...

  test:
    desc: Run unit tests with the race detector.
    cmds:
      - go test ./... -race

  integration:
    desc: Run integration-tagged tests with the race detector.
    cmds:
      # postgrestest runs close to go test's default 10m package timeout under -race on slower
      # machines (and while verify runs its other tasks in parallel); the CI job keeps its own cap.
      - go test -tags=integration ./... -race -timeout=20m

  lint:
    desc: Run the pinned golangci-lint tool.
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run --build-tags=integration

  vulncheck:
    desc: Fail when reachable code calls a known-vulnerable Go module or stdlib symbol.
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags=integration ./...

  fmt-check:
    desc: Fail when Go source is not gofmt-formatted.
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 fmt -d

  migrate:
    desc: Run the embedded migration command; pass up, down, or status after --.
    cmds:
      - go run ./cmd/migrate {{.CLI_ARGS}}

  sqlc:
    desc: Generate the pinned sqlc persistence package.
    cmds:
      - go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

  sqlc-diff:
    desc: Fail when committed sqlc output differs from its schema or queries.
    cmds:
      - go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff

  curve-vectors-sync:
    desc: Copy the authoritative Solidity curve vectors into backend testdata.
    cmds:
      - go run ./cmd/sync-curve-vectors

  curve-vectors-diff:
    desc: Fail when the backend curve-vector copy differs from the Solidity source.
    cmds:
      - go run ./cmd/sync-curve-vectors --check

  event-abis-sync:
    desc: Copy the authoritative Solidity event ABIs and Foundry fixtures into the backend chain package.
    cmds:
      - go run ./cmd/sync-event-abis

  event-abis-diff:
    desc: Fail when backend event ABIs or Foundry fixtures differ from their contracts sources.
    cmds:
      - go run ./cmd/sync-event-abis --check

  deployments-diff:
    desc: Fail when the backend deployment-manifest copy differs from the contracts source.
    cmds:
      - go run ./cmd/check-deployments

  openapi-diff:
    desc: Validate the committed OpenAPI contract is current and compatible with the v1 baseline.
    cmds:
      - go run ./cmd/check-openapi

  anvil-indexer-e2e:
    desc: Index a real local Factory launch from Anvil through PostgreSQL.
    cmds:
      - cmd: powershell -ExecutionPolicy Bypass -File scripts/run-anvil-indexer-e2e.ps1
        platforms: [windows]
      - cmd: pwsh -File scripts/run-anvil-indexer-e2e.ps1
        platforms: [linux, darwin]

  anvil-v2-indexer-e2e:
    desc: Drive an engine-2 launch through graduation, a reorg, V4 swaps and LP fee claims on Anvil.
    cmds:
      - cmd: powershell -ExecutionPolicy Bypass -File scripts/run-anvil-v2-indexer-e2e.ps1
        platforms: [windows]
      - cmd: pwsh -File scripts/run-anvil-v2-indexer-e2e.ps1
        platforms: [linux, darwin]

  anvil-e2e:
    desc: Run both Anvil end-to-end suites one after the other; both compile contracts/out.
    cmds:
      - task: anvil-indexer-e2e
      - task: anvil-v2-indexer-e2e

  verify:
    desc: Run the full backend gate -- format, build, test, integration, lint, and drift checks.
    deps:
      - build
      - test
      - integration
      - lint
      - fmt-check
      - vulncheck
      - sqlc-diff
      - curve-vectors-diff
      - event-abis-diff
      - deployments-diff
      - openapi-diff
      - anvil-e2e
