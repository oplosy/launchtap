name: backend

on:
  push:
    branches:
      - dev
    paths:
      - "backend/**"
      - "contracts/deployments/**"
      - "contracts/vectors/**"
      - "contracts/abi/v1/**"
      - "contracts/fixtures/**"
      - ".gitattributes"
      - ".github/workflows/backend.yml"
  pull_request:
    branches:
      - main
      - dev
    # No path filter: these checks are required on dev and main, so they must always report.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/launchpad_test?sslmode=disable
      INTEGRATION_REQUIRED: "true"

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: launchpad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d launchpad_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1
          cache: true

      - name: Run backend gate
        run: go run github.com/go-task/task/v3/cmd/task@v3.53.1 verify

      - name: Prove migration integration test executed
        shell: bash
        run: |
          set -o pipefail
          output_file="$(mktemp)"
          trap 'rm -f "$output_file"' EXIT
          go test -tags=integration -race -v -run '^TestMigrationsUpDownUp$' ./internal/store/postgres/... 2>&1 | tee "$output_file"
          grep -Fq -- '--- PASS: TestMigrationsUpDownUp' "$output_file"
          if grep -Eq -- '--- (SKIP|FAIL): TestMigrationsUpDownUp' "$output_file"; then
            exit 1
          fi

      - name: Prove API integration and OpenAPI sentinels executed
        shell: bash
        run: |
          set -o pipefail
          output_file="$(mktemp)"
          trap 'rm -f "$output_file"' EXIT
          go test -tags=integration -race -v -run '^(TestMetadataAndImagesAuthorizeAndUseRevisionsAtomically|TestOpenAPIContractIncludesPlan3Endpoints)$' ./internal/apiserver ./internal/store/postgres/postgrestest 2>&1 | tee "$output_file"
          grep -Fq -- '--- PASS: TestMetadataAndImagesAuthorizeAndUseRevisionsAtomically' "$output_file"
          grep -Fq -- '--- PASS: TestOpenAPIContractIncludesPlan3Endpoints' "$output_file"
          if grep -Eq -- '--- (SKIP|FAIL): (TestMetadataAndImagesAuthorizeAndUseRevisionsAtomically|TestOpenAPIContractIncludesPlan3Endpoints)' "$output_file"; then
            exit 1
          fi
