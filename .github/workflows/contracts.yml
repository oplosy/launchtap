name: contracts

on:
  push:
    branches:
      - dev
    paths:
      - "contracts/**"
      - ".gitmodules"
      - ".github/workflows/contracts.yml"
  pull_request:
    branches:
      - main
      - dev
    # No path filter: these checks are required on dev and main, so they must always report.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Foundry
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1
          cache: true

      - name: Run contract gate
        shell: pwsh
        run: ./contracts/scripts/check.ps1 all

  robinhood-mainnet-fork:
    name: Robinhood mainnet fork
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROBINHOOD_MAINNET_ARCHIVE_RPC_URL: ${{ secrets.ROBINHOOD_MAINNET_ARCHIVE_RPC_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1
          cache: true

      - name: Run pinned Robinhood mainnet fork gate
        shell: pwsh
        run: ./contracts/scripts/check.ps1 fork

  release-gate:
    name: Release gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROBINHOOD_MAINNET_ARCHIVE_RPC_URL: ${{ secrets.ROBINHOOD_MAINNET_ARCHIVE_RPC_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1
          cache: true

      - name: Install Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install Slither
        run: pipx install slither-analyzer==0.11.6

      - name: Run release gate
        shell: pwsh
        run: ./contracts/scripts/check.ps1 release
