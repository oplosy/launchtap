name: release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Release validation target
        required: true
        default: production
        type: choice
        options: [production, anvil]
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - "backend/**"
      - "web/**"
      - "scripts/verify-release.*"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  release:
    name: release gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: launchpad_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d launchpad_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Pull requests exercise the deterministic Anvil release gate. Production
      # validation remains fail-closed and is available only when explicitly
      # selected through workflow_dispatch.
      RELEASE_TARGET: ${{ github.event_name == 'pull_request' && 'anvil' || github.event.inputs.target || 'production' }}
      NEXT_PUBLIC_PRIVY_APP_ID: ${{ vars.NEXT_PUBLIC_PRIVY_APP_ID }}
      NEXT_PUBLIC_DEPLOYMENT_ID: ${{ vars.NEXT_PUBLIC_DEPLOYMENT_ID }}
      NEXT_PUBLIC_CHAIN_ID: ${{ vars.NEXT_PUBLIC_CHAIN_ID }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_RPC_URL: ${{ vars.NEXT_PUBLIC_RPC_URL }}
      NEXT_PUBLIC_WEB_ORIGIN: ${{ vars.NEXT_PUBLIC_WEB_ORIGIN }}
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/launchpad_test?sslmode=disable
      INTEGRATION_REQUIRED: "true"
      # The backend `task verify` step (uncached Go toolchain, race + integration tests, anvil
      # e2e) takes 9-10 minutes on a hosted runner, at the edge of the 10-minute script default.
      # The job's timeout-minutes stays the outer bound.
      RELEASE_COMMAND_TIMEOUT_MS: "1200000"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1
          cache: true
      - name: Configure system Chrome for Playwright
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || true)"
          if [ -z "$chrome_path" ]; then
            echo "google-chrome is required on the ubuntu-latest runner"
            exit 1
          fi
          echo "PLAYWRIGHT_EXECUTABLE_PATH=$chrome_path" >> "$GITHUB_ENV"
          "$chrome_path" --version
      - name: Run mandatory cross-stack release gate
        run: node scripts/verify-release.mjs
