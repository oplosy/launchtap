name: deployment package

on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "web/**"
      - "deploy/**"
      - ".github/workflows/deployment-package.yml"
  pull_request:
    branches: [main, dev]
    # No path filter: these checks are required on dev and main, so they must always report.

permissions:
  contents: read

jobs:
  containers:
    name: deployment package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check monitoring configuration and alert rules
        env:
          PROMETHEUS_IMAGE: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
          ALERTMANAGER_IMAGE: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
        run: |
          promtool() { docker run --rm -v "$PWD/deploy/monitoring:/etc/prometheus:ro" --entrypoint promtool "$PROMETHEUS_IMAGE" "$@"; }
          promtool check config /etc/prometheus/prometheus.yml
          promtool check rules /etc/prometheus/alerts.yml
          promtool test rules /etc/prometheus/alerts.test.yml
          docker run --rm -v "$PWD/deploy/monitoring:/m:ro" -v "$PWD/deploy/monitoring/webhook-url.example:/run/secrets/alertmanager_webhook_url:ro" \
            --entrypoint amtool "$ALERTMANAGER_IMAGE" check-config /m/alertmanager.yml
      - name: Build and verify disposable runtime
        shell: pwsh
        run: ./deploy/check.ps1 -Build
